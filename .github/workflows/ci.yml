name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint and format all non-optics workspace crates cleanly without needing the optics monorepo.
  fmt-and-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev wayland-protocols \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config
      - name: Clippy (flux-free crates)
        run: >-
          cargo clippy
          -p aegis-core -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-ctl -p aegis-fuji -p aegis-protocols -p aegis-compositor
          -p aegis-portal
          --all-targets -- -D warnings
      - name: Doc check (flux-free crates)
        run: >-
          cargo doc --no-deps
          -p aegis-core -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-ctl -p aegis-fuji -p aegis-protocols -p aegis-compositor
          -p aegis-portal

  # Test all non-optics workspace crates (aegis-core, aegis-config, aegis-ipc, aegis-desktop-entries, aegis-launcher, aegis-ctl, aegis-fuji, aegis-compositor, aegis-protocols, aegis-portal).
  flux-free-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev wayland-protocols \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config
      - name: Test flux-free crates
        run: >-
          cargo test
          -p aegis-core -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-ctl -p aegis-fuji -p aegis-compositor
          -p aegis-portal
      - name: Build aegis-protocols
        run: cargo build -p aegis-protocols

  # Full workspace build + test. Requires the sibling optics stack with a
  # built Meson tree and its Rust bindings. Disabled by default until the
  # repo integration strategy (multi-checkout / mirror) is decided.
  full-workspace:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev wayland-protocols libvulkan-dev \
            libxkbcommon-dev mesa-vulkan-drivers \
            pkg-config meson ninja-build
      # TODO: decide how flux and lens are accessed in CI (multi-checkout,
      # mirror, manual checkout). Once that lands, build ../optics/build,
      # then run `cargo test --workspace` and `cargo build --workspace`.
      - name: Full workspace
        run: cargo build --workspace

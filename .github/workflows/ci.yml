name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  RUSTFLAGS: "-C symbol-mangling-version=v0 -C link-arg=-fuse-ld=mold"

jobs:
  # Resolve the locked remote binding sources, but do not build native
  # rendering crates in this fast job.
  fmt-and-clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Validate canonical Cargo lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Spell check
        uses: crate-ci/typos@master
      - name: Package conformity
        run: cargo run --package xtask -- package-conformity
      - name: Crate dependency boundaries
        run: cargo run --package xtask -- check-boundaries
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev wayland-protocols \
            libclang-dev pkg-config mold
      - name: Clippy (flux-free crates)
        run: >-
          cargo clippy --locked
          -p aegis-model -p aegis-security -p aegis-semantic
          -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-commands -p aegis-mcp -p aegis-idle
          -p aegis-atspi -p aegis-wayland-protocols -p aegis-compositor
          --all-targets -- -D warnings
      - name: Doc check (flux-free crates)
        run: >-
          cargo doc --locked --no-deps
          -p aegis-model -p aegis-security -p aegis-semantic
          -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-commands -p aegis-mcp -p aegis-idle
          -p aegis-atspi -p aegis-wayland-protocols -p aegis-compositor

  flux-free-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev wayland-protocols \
            libclang-dev libxkbcommon-dev pkg-config mold
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test flux-free crates
        run: >-
          cargo nextest run --profile ci --locked
          -p aegis-model -p aegis-security -p aegis-semantic
          -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-commands -p aegis-mcp -p aegis-idle
          -p aegis-atspi -p aegis-compositor
      - name: Build aegis-wayland-protocols
        run: cargo build --locked -p aegis-wayland-protocols

  # Exercise the downstream contract: Rust bindings come from the locked
  # optics Git source, while native libraries come from a system install.
  full-workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the locked Optics release
        id: optics-release
        run: echo "ref=$(cargo run --package xtask -- optics --tag-only)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ming2k/optics
          path: optics
          ref: ${{ steps.optics-release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config glslang-tools \
            libwayland-dev wayland-protocols libvulkan-dev \
            vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libxkbcommon-dev libsystemd-dev libclang-dev \
            libinput-dev libseat-dev libpam0g-dev python3-pip mold
          # optics' meson.build requires >=1.8.0; Ubuntu 24.04's apt ships 1.3.2.
          sudo python3 -m pip install --break-system-packages 'meson>=1.8'
          # optics builds with c_std=c23; Ubuntu 24.04's GCC 13 has no
          # c23 mode, so compile the C libraries with Clang.
          sudo apt-get install -y clang
      - name: Build and install optics C libraries
        run: |
          CC=clang CXX=clang++ meson setup optics/build optics \
            -Dexamples=false -Dtests=false --buildtype=release
          meson compile -C optics/build
          sudo meson install -C optics/build
          sudo ldconfig
          pkg-config --modversion flux flux-scene-graph lens iris
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test full workspace
        run: |
          cargo nextest run --profile ci --locked --workspace
          cargo test --doc --locked --workspace
      - name: Check selective chrome builds
        run: |
          cargo check --locked -p aegis --no-default-features
          cargo check --locked -p aegis --no-default-features --features chrome-hud
          cargo check --locked -p aegis --no-default-features --features chrome-command-panel
          cargo check --locked -p aegis --no-default-features \
            --features chrome-dock,chrome-prism
      - name: Build release binaries
        run: cargo build --locked --release --workspace

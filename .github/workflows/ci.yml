name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve the locked remote binding sources, but do not build native
  # rendering crates in this fast job.
  fmt-and-clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev wayland-protocols \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config
      - name: Clippy (flux-free crates)
        run: >-
          cargo clippy --locked
          -p aegis-core -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-ctl -p aegis-fuji -p aegis-protocols -p aegis-compositor
          -p aegis-portal
          --all-targets -- -D warnings
      - name: Doc check (flux-free crates)
        run: >-
          cargo doc --locked --no-deps
          -p aegis-core -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-ctl -p aegis-fuji -p aegis-protocols -p aegis-compositor
          -p aegis-portal

  flux-free-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev wayland-protocols \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config
      - name: Test flux-free crates
        run: >-
          cargo test --locked
          -p aegis-core -p aegis-config -p aegis-ipc -p aegis-desktop-entries
          -p aegis-launcher -p aegis-ctl -p aegis-fuji -p aegis-compositor
          -p aegis-portal
      - name: Build aegis-protocols
        run: cargo build --locked -p aegis-protocols

  # Exercise the downstream contract: Rust bindings come from the locked
  # optics Git source, while native libraries come from a system install.
  full-workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the locked Optics release
        id: optics-release
        run: echo "ref=$(scripts/optics-release-ref.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ming2k/optics
          path: optics
          ref: ${{ steps.optics-release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config glslang-tools \
            libwayland-dev wayland-protocols libvulkan-dev \
            vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libxkbcommon-dev libsystemd-dev libclang-dev \
            libinput-dev libseat-dev libpipewire-0.3-dev libspa-0.2-dev
      - name: Build and install optics C libraries
        run: |
          meson setup optics/build optics \
            -Dexamples=false -Dtests=false --buildtype=release
          meson compile -C optics/build
          sudo meson install -C optics/build
          sudo ldconfig
          pkg-config --modversion flux flux-scene-graph lens iris
      - name: Test full workspace
        run: cargo test --locked --workspace
      - name: Build release binaries
        run: cargo build --locked --release --workspace

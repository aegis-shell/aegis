[package]
name = "aegis"
description = "autonomous surface shell — a Wayland compositor"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "aegis"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-core = { workspace = true }
aegis-compositor = { workspace = true }
aegis-backend = { workspace = true }
aegis-render = { workspace = true }
aegis-shell = { workspace = true }
# Chrome components split out of ass-shell (ADR-0044); only the binary
# composes them into the shell.
aegis-dock = { workspace = true }
aegis-ai-workspaces = { workspace = true }
aegis-statusbar = { workspace = true }
aegis-wallpaper = { workspace = true }
# Declarative configuration: TOML schema + live reload (ADR-0026).
aegis-config = { workspace = true }
# IPC and introspection surface (ADR-0027).
aegis-ipc = { workspace = true }
# Launcher: enumerate `.desktop` entries and spawn them detached (ADR-0022).
# Only the binary wires these; ass-shell and ass-render stay free of them.
aegis-desktop-entries = { workspace = true }
aegis-launcher = { workspace = true }
flux = { workspace = true }
lens = { workspace = true }
image = { workspace = true }
log.workspace = true
env_logger.workspace = true
# Direct deps purely so this binary's build script receives DEP_FLUX_RPATHS /
# DEP_LENS_RPATHS (published via the -sys crates' `links` metadata) and can
# re-emit the rpaths — `rustc-link-arg` does not propagate across crates.
flux-sys = { workspace = true }
flux-scene-graph-sys = { workspace = true }
lens-sys = { workspace = true }

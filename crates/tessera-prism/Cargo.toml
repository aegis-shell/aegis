[package]
name = "tessera-prism"
description = "Spotlight-style application search chrome for the tessera compositor"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
tessera-model = { workspace = true }
tessera-design = { workspace = true }
tessera-ui = { workspace = true }
tessera-shell = { workspace = true }
lens = { workspace = true }
# Direct dep purely so this crate's build script receives DEP_LENS_RPATHS
# (published via the -sys crate's `links` metadata) and can re-emit the rpaths
# for the test harness.
lens-sys = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["lens-sys"]

[lints]
workspace = true

[package]
name = "aegis-command-panel"
description = "Modal command panel for the aegis compositor: quick settings, tray interaction, and notifications in frosted white floating panels (ADR-0080)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
# The caller-owned VRM camera and renderer.
aegis-avatar = { workspace = true }
# Shared account identity, static/VRM source routing, and live reload.
aegis-identity = { workspace = true }
aegis-core = { workspace = true }
aegis-design = { workspace = true }
aegis-shell = { workspace = true }
aegis-tray = { workspace = true }
# Direct dep purely so this crate's build script receives
# DEP_FLUX_SCENE_GRAPH_RPATHS (the avatar's VRM path links the scene graph)
# and can re-emit the rpaths for the test harness — `rustc-link-arg` does
# not propagate across crates.
flux-scene-graph-sys = { workspace = true }
# SNI tray icon upload: borrowed flux device + texture cache (same pixel ->
# GPU path as the compositor's app icon cache).
flux = { workspace = true }
lens = { workspace = true }
# Direct dep purely so this crate's build script receives DEP_LENS_RPATHS
# (published via the -sys crate's `links` metadata) and can re-emit the rpaths
# for the test harness — `rustc-link-arg` does not propagate across crates.
lens-sys = { workspace = true }
log = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["flux-scene-graph-sys", "lens-sys"]

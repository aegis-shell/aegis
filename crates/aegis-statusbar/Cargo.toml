[package]
name = "aegis-statusbar"
description = "Status bar chrome component for the ass compositor: workspaces, live controls, notifications, tray, and clock"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
aegis-core = { workspace = true }
aegis-design = { workspace = true }
aegis-shell = { workspace = true }
# SNI IconName resolution through the freedesktop icon theme: the same
# lookup (ass-apps) and decode (image + rsvg-convert) path as the
# compositor's app icon cache.
aegis-desktop-entries = { workspace = true }
image = { workspace = true }
# SNI tray icon upload: borrowed flux device + texture cache (same pixel ->
# GPU path as the compositor's app icon cache).
flux = { workspace = true }
# In-process local-time formatting for the clock (replaces forking `date`).
libc = { workspace = true }
lens = { workspace = true }
zbus = { workspace = true }
# Direct dep purely so this crate's build script receives DEP_LENS_RPATHS
# (published via the -sys crate's `links` metadata) and can re-emit the rpaths
# for the test harness — `rustc-link-arg` does not propagate across crates.
lens-sys = { workspace = true }
log = { workspace = true }

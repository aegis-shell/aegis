[package]
name = "ass-control"
description = "Command-line driver for the ass IPC (the reference external tool)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ass_control"
path = "src/lib.rs"

[[bin]]
name = "ass-control"
path = "src/main.rs"

[dependencies]
ass-ipc = { workspace = true }
ass-core = { workspace = true, features = ["serde"] }
ass-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
clap_complete = "4"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

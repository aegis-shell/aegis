[package]
name = "ass-config"
description = "Declarative configuration for ass: versioned TOML schema, loader, live reload"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Pure: no flux, lens, or Wayland dependency. The schema is shared types from
# `ass-core` (Mods, Keybind, Keymap, and the name resolvers), so configuration
# stays unit-testable in isolation — mirroring `ass-core::keybind`. ADR-0026.
ass-core = { workspace = true, features = ["serde"] }
serde = { workspace = true }
toml = { workspace = true }
# `$XDG_CONFIG_HOME` / `~/.config` resolution for the default config path.
# Already a workspace dependency (ass-apps uses it for XDG data dirs).
dirs = { workspace = true }
log.workspace = true
# Typed errors without handwritten Display/From impls (matches ass-shell).
thiserror.workspace = true

[package]
name = "aegis-portal"
description = "xdg-desktop-portal backend for the aegis compositor: D-Bus bridge over the scoped aegis IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aegis-ipc = { workspace = true }
# aegis-ipc's pick results and window snapshots carry aegis-core types (Rect,
# WindowId, Window); a workspace-internal crate, no new external dependency.
aegis-core = { workspace = true }
# Session D-Bus bridge (ADR-0051): pure-Rust zbus with the blocking API so the
# service stays a plain `std::thread` model — same red line as the SNI tray
# (crates/aegis-statusbar), no tokio.
zbus = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
thiserror = { workspace = true }
# ScreenCast delivery: a PipeWire producer stream fed from the compositor's
# scoped IPC frame stream (ADR-0052). Rust binding over the system
# libpipewire (rust-version 1.80, within the workspace MSRV); no tokio.
pipewire = "0.10"
# Portal-owned persistent state (Background decisions, ScreenCast restore
# tokens, ADR-0053): JSON documents written atomically under
# $XDG_DATA_HOME/aegis-portal. Both crates already carry the workspace IPC and
# config, so this adds no new external dependency.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lib]
name = "aegis_portal"
path = "src/lib.rs"

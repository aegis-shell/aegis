[package]
name = "aegis-hud"
description = "Display-only floating HUD status chips for the aegis compositor: system status, tray icons, workspace dots, clock, and notifications"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
aegis-model = { workspace = true }
aegis-design = { workspace = true }
aegis-ui = { workspace = true }
aegis-shell = { workspace = true }
# SNI system tray service (watcher/host on the session bus), shared with the
# command panel through a single spawn in the composition root (ADR-0080).
aegis-tray = { workspace = true }
# SNI tray icon upload: borrowed flux device + texture cache (same pixel ->
# GPU path as the compositor's app icon cache).
flux = { workspace = true }
# In-process local-time formatting for the clock (replaces forking `date`).
libc = { workspace = true }
lens = { workspace = true }
# Direct dep purely so this crate's build script receives DEP_LENS_RPATHS
# (published via the -sys crate's `links` metadata) and can re-emit the rpaths
# for the test harness — `rustc-link-arg` does not propagate across crates.
lens-sys = { workspace = true }
log = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["lens-sys"]

[lints]
workspace = true

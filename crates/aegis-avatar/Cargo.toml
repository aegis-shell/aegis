[package]
name = "aegis-avatar"
description = "User avatar loading and rendering: still images and VRM models"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# XDG base-directory resolution reused from the freedesktop integration
# crate, so this crate never hand-rolls $XDG_DATA_HOME again.
aegis-desktop-entries = { workspace = true }
flux = { workspace = true }
flux-sys = { workspace = true }
flux-scene-graph = { workspace = true }
flux-scene-graph-sys = { workspace = true }
image = { workspace = true }
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[package.metadata.cargo-machete]
ignored = ["flux-scene-graph-sys", "flux-sys"]

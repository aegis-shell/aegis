[package]
name = "aegis-ui"
description = "Composite UI component library and chrome scaffolding for aegis"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
aegis-model = { workspace = true }
aegis-design = { workspace = true }
lens = { workspace = true }
# Direct dep so this crate's test harness receives DEP_LENS_RPATHS and can
# resolve the selected Lens/Flux native libraries through build.rs.
lens-sys = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["lens-sys"]

[package]
name = "aegis-commands"
description = "Domain-oriented management commands for a running Aegis session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "aegis_commands"
path = "src/lib.rs"

[dependencies]
aegis-ipc = { workspace = true }
aegis-model = { workspace = true, features = ["serde"] }
aegis-config = { workspace = true }
aegis-security = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize.workspace = true
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
clap_complete = "4"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

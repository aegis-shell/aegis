[package]
name = "tessera-settings"
description = "Settings module library for tessera, hosted in-process by the command panel"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tessera-model = { workspace = true }
tessera-design = { workspace = true }
tessera-ui = { workspace = true }
tessera-shell = { workspace = true }
lens = { workspace = true }
# Direct dep purely so this crate's build script receives DEP_LENS_RPATHS
# (published via the -sys crate's `links` metadata) and can re-emit the rpaths
# for the test harness — `rustc-link-arg` does not propagate across crates.
lens-sys = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["lens-sys"]

[lints]
workspace = true

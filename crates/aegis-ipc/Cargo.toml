[package]
name = "aegis-ipc"
description = "Versioned IPC and introspection surface for aegis over a unix socket"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Pure: depends on `aegis-model` (with the `serde` feature so the IPC sends the
# same `Window` the renderer and chrome read) and on `serde`/`serde_json` for
# the wire format. No flux, lens, or Wayland dependency, so the codec and a
# loopback server are unit-testable in isolation. See ADR-0027.
aegis-model = { workspace = true, features = ["serde"] }
aegis-security.workspace = true
aegis-semantic.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
libc.workspace = true
zeroize.workspace = true

[lints]
workspace = true

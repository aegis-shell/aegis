[package]
name = "aegis-mcp"
description = "Aegis MCP platform bridge: scoped desktop and Agent Interaction Domain tools over MCP for any agent"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "aegis_mcp"
path = "src/lib.rs"

[[bin]]
name = "aegis-mcp"
path = "src/bin/aegis-mcp.rs"

[dependencies]
# The public Aegis model, catalog, and IPC crates, plus the shared agent
# client layer (ADR-0125). Never an agent runtime.
aegis-model = { workspace = true, features = ["serde"] }
aegis-ipc = { workspace = true }
aegis-agent = { workspace = true }
aegis-desktop-entries = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

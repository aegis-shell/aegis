[package]
name = "ass-neenee"
description = "Scoped ASS desktop and Agent Realm MCP bridge for Neenee"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ass_neenee"
path = "src/lib.rs"

[[bin]]
name = "ass-neenee-mcp"
path = "src/main.rs"

[dependencies]
ass-core = { workspace = true, features = ["serde"] }
ass-ipc = { workspace = true }
ass-apps = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
libc = { workspace = true }

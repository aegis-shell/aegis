[package]
name = "ass"
description = "autonomous surface shell — a Wayland compositor"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "ass"

[[bin]]
name = "ass"
path = "src/main.rs"

[dependencies]
ass-core = { workspace = true }
ass-server = { workspace = true }
ass-backend = { workspace = true }
ass-render = { workspace = true }
ass-shell = { workspace = true }
ass-wallpaper = { workspace = true }
# Declarative configuration: TOML schema + live reload (ADR-0026).
ass-config = { workspace = true }
# IPC and introspection surface (ADR-0027).
ass-ipc = { workspace = true }
# Launcher: enumerate `.desktop` entries and spawn them detached (ADR-0022).
# Only the binary wires these; ass-shell and ass-render stay free of them.
ass-apps = { workspace = true }
ass-launch = { workspace = true }
flux = { workspace = true }
lens = { workspace = true }
image = { workspace = true }
log.workspace = true
env_logger.workspace = true
# XDG base-directory resolution for the default screenshot save path.
dirs = { workspace = true }
# Direct deps purely so this binary's build script receives DEP_FLUX_RPATHS /
# DEP_LENS_RPATHS (published via the -sys crates' `links` metadata) and can
# re-emit the rpaths — `rustc-link-arg` does not propagate across crates.
flux-sys = { workspace = true }
flux-scene-graph-sys = { workspace = true }
lens-sys = { workspace = true }

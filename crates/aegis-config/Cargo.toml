[package]
name = "aegis-config"
description = "Declarative configuration for aegis: versioned TOML schema, loader, live reload"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Pure: no flux, lens, or Wayland dependency. The schema is shared types from
# `aegis-core` (Mods, Keybind, Keymap, and the name resolvers), so configuration
# stays unit-testable in isolation — mirroring `aegis-core::keybind`. ADR-0026.
aegis-core = { workspace = true, features = ["serde"] }
serde = { workspace = true }
toml = { workspace = true }
# Preserving edits to the user-editable TOML file (e.g. dock pins).
toml_edit = "0.22"
# `$XDG_CONFIG_HOME` / `~/.config` resolution for the default config path.
# Already a workspace dependency (aegis-desktop-entries uses it for XDG data dirs).
dirs = { workspace = true }
libc.workspace = true

# Typed errors without handwritten Display/From impls (matches aegis-shell).
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

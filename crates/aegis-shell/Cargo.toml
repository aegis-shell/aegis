[package]
name = "aegis-shell"
description = "Compositor chrome host and contract: Shell, Chrome, launcher, workspaces, decorations, and notifications"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
aegis-core = { workspace = true }
aegis-design = { workspace = true }
lens = { workspace = true }
lens-sys = { workspace = true }
log.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
# statvfs for the resource probe's root-filesystem usage sample.
libc.workspace = true
# The secret prompt's edit buffer is zeroized on close (password hygiene).
zeroize = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["lens-sys"]

[package]
name = "ass-apps"
description = "freedesktop.org desktop-entry enumeration and icon-theme lookup"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ass-core = { workspace = true }
# XDG base-directory resolution ($XDG_DATA_HOME / $XDG_DATA_DIRS).
dirs = "5"
# INI parsing for .desktop entries and theme index.theme Inherits lines.
rust-ini = "0.20"
log.workspace = true
thiserror.workspace = true

[package]
name = "aegis-lock"
description = "First-party secure session locker for the Aegis desktop"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
dev-preview = []

[[bin]]
name = "aegis-lock"
path = "src/main.rs"

[[bin]]
name = "aegis-lock-preview"
path = "src/preview_main.rs"
required-features = ["dev-preview"]

[dependencies]
aegis-config.workspace = true
aegis-design.workspace = true
aegis-shell = { workspace = true, features = ["persona"] }
aegis-wallpaper.workspace = true
ash.workspace = true
aegis-logging.workspace = true
flux.workspace = true
flux-sys.workspace = true
flux-scene-graph-sys.workspace = true
lens.workspace = true
lens-sys.workspace = true
libc.workspace = true
log.workspace = true
smithay-client-toolkit.workspace = true
# wayland-backend stays out of the manifest: wayland-client's "system"
# feature already enables wayland-backend/client_system.
thiserror.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
xkbcommon.workspace = true
zeroize.workspace = true

[build-dependencies]
pkg-config = "0.3"

[package.metadata.cargo-machete]
ignored = ["flux-sys", "flux-scene-graph-sys", "lens-sys", "pkg-config"]

[lints]
workspace = true

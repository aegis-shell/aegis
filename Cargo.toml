[workspace]
resolver = "3"
members = ["crates/*", "tooling/*"]

[workspace.package]
version = "0.0.50"
edition = "2024"
# Workspace crates contain MIT-licensed source, including the bundled cursor
# art under assets/cursors/Aegis (original, generated in-tree).
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/ming2k/aegis"

[workspace.dependencies]
# flux (rendering engine) + lens (immediate-mode UI engine) Rust bindings.
# The canonical build resolves the binding sources from the tagged optics
# monorepo and links the C libraries discovered by pkg-config. A linked
# development worktree can patch these sources through
# .cargo/optics-local.toml without making a sibling checkout mandatory for CI
# or downstream packagers.
flux = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
flux-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
flux-scene-graph = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
flux-scene-graph-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
# Renderer-neutral offscreen DAG planning above Flux image operators.
flux-composition-graph = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
lens = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
lens-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
iris = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
# prism (material library; ADR-0063) carries the liquid-glass compositor.
# Canonical resolution needs an optics tag containing prism-rs.
prism = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }
prism-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.29" }

# Observability: crates emit through the `log` facade; each binary installs a
# `tracing`-based subscriber through the shared `aegis-logging` crate, which
# bridges `log::` records into structured spans and fields (ADR-0079).
# Long-term this seam is also how the AI-adaptation phase subscribes to
# compositor events.
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "json",
    "registry",
] }

# aegis-mcp is the platform's MCP bridge. aegis exposes the bridge so any
# agent can discover scoped desktop and Interaction Domain tools without
# linking an agent stack into the compositor (ADR-0047, ADR-0087).
base64 = "0.22"
fastrand = "2"
flate2 = "1"
getrandom = "0.4"
hmac = "0.12"
notify = "8.2"
sha2 = "0.10"
atspi = { version = "0.30", features = ["zbus"] }
async-io = "2"

# Session D-Bus for the StatusNotifierItem system tray (aegis-tray, shared by
# aegis-hud and aegis-command-panel).
# Pure-Rust zbus (no libdbus system dep) with the blocking API so the tray
# worker stays a plain `std::thread`; `async-io` is zbus's smol-based
# internal executor — tokio stays out of the dependency graph.
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

# Typed errors without handwritten Display/From impls.
thiserror = "2"

# Direct-display backend: drm-rs provides atomic KMS, libseat mediates
# privileged device access/session switching, and input is the maintained
# libinput wrapper. Keep the libinput feature pinned to the host ABI floor we
# build and test against rather than relying on its crate defaults.
drm = "0.15"
libseat = { version = "0.2.4", default-features = false }
input = { version = "0.10", default-features = false, features = [
    "udev",
    "log",
    "libinput_1_30",
] }
udev = "0.9"
libc = "0.2"

# Launcher (aegis-desktop-entries): XDG base-directory resolution and .desktop / index.theme
# INI parsing. Kept off every other crate.
dirs = "5"
ini = { package = "rust-ini", version = "0.20" }

# Shared, effect-free Aegis state and deterministic model rules.
aegis-model = { path = "crates/aegis-model" }
# Transport-neutral Actor authority plus hash-chained audit persistence.
aegis-security = { path = "crates/aegis-security" }
# Validated application accessibility trees and semantic dispatch routing.
aegis-semantic = { path = "crates/aegis-semantic" }
# Out-of-process AT-SPI accessibility adapter for semantic observations.
aegis-atspi = { path = "crates/aegis-atspi" }
# Shared tracing-based observability init installed once by every binary.
aegis-logging = { path = "crates/aegis-logging" }
aegis-wayland-protocols = { path = "crates/aegis-wayland-protocols" }
aegis-compositor = { path = "crates/aegis-compositor" }
aegis-backend = { path = "crates/aegis-backend" }
aegis-render = { path = "crates/aegis-render" }
aegis-shell = { path = "crates/aegis-shell" }
# Product-specific design tokens, themes, and materials shared by chrome.
aegis-design = { path = "crates/aegis-design" }
# Composite UI patterns, dialog scaffolding, and chrome widgets.
aegis-ui = { path = "crates/aegis-ui" }
# Chrome components promoted out of aegis-shell (ADR-0044).
aegis-dock = { path = "crates/aegis-dock" }
aegis-prism = { path = "crates/aegis-prism" }
# Display-only floating HUD status chips (ADR-0080).
aegis-hud = { path = "crates/aegis-hud" }
# SNI system tray service shared by shell chrome (ADR-0080).
aegis-tray = { path = "crates/aegis-tray" }
# Modal command panel (ADR-0080).
aegis-command-panel = { path = "crates/aegis-command-panel" }
aegis-wallpaper = { path = "crates/aegis-wallpaper" }
# First-party session products. The compositor retains the protocol and
# fail-closed authority; these packages are ordinary Wayland clients.
aegis-lock = { path = "crates/aegis-lock" }
aegis-idle = { path = "crates/aegis-idle" }
# Settings module library hosted by the command panel (ADR-0056).
aegis-settings = { path = "crates/aegis-settings" }
# Configuration: versioned TOML schema, loader, and live reload (ADR-0026).
aegis-config = { path = "crates/aegis-config" }
# IPC: versioned schema over a unix socket (ADR-0027).
aegis-ipc = { path = "crates/aegis-ipc" }
# Rich client library for the capability broker: pairing, credentials,
# state recovery, and observation leases for out-of-process consumers
# (ADR-0125).
aegis-ipc-client = { path = "crates/aegis-ipc-client" }
# Domain-oriented native command implementation used by the `aegis` binary.
aegis-commands = { path = "crates/aegis-commands" }
# Remote interaction gateway for the Universal Interaction Protocol (UIP).
aegis-remote = { path = "crates/aegis-remote" }
# Launcher: XDG application discovery + detached launch. See ADR-0022.
aegis-desktop-entries = { path = "crates/aegis-desktop-entries" }
aegis-launcher = { path = "crates/aegis-launcher" }
# aegis-mcp: the scoped Aegis platform bridge over MCP — the standard agent
# access point (ADR-0047, ADR-0087). It is an out-of-process adapter any MCP
# client can spawn; the compositor never links it.
aegis-mcp = { path = "crates/aegis-mcp" }

# Declarative configuration (ADR-0026). `serde` drives the schema; `toml` is
# the chosen file format over KDL/YAML/INI for tooling maturity and an
# unambiguous grammar. `serde_json` is the IPC wire format (ADR-0027):
# human-debuggable and schema-driven, distinct from adopting the i3 protocol.
serde = { version = "1", features = ["derive"] }
# toml 1.x shares the toml_parser/toml_datetime/winnow 1.x stack with the
# toml_edit 0.25 line used by aegis-config, so the old toml_edit 0.22 /
# toml_datetime 0.6 / winnow 0.7 copies drop out of the graph.
toml = "1"
serde_json = "1"

# Image decode for the wallpaper crate. default-features off so the
# avif decoder (which needs dav1d on the host) does not gate the build;
# the enabled set covers still and animated formats used by wallpaper/chrome.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }

# SVG cursor rasterization (pure Rust; see ADR-0070 and cursor.rs). The
# bundled Aegis cursors are path/fill/stroke art with no text and no
# embedded raster images, so resvg/usvg default-features stay off: that
# drops the text-shaping (rustybuzz/fontdb/unicode) and image-decode
# (gif/webp/jpeg) trees from the compositor build entirely.
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"

# Embed the bundled Aegis cursor theme into the binary so a
# sane default exists even with no XCURSOR_THEME and a bare TTY.
include_dir = "0.7"

# Standalone first-party Wayland clients. The system backend is required by
# aegis-lock because Vulkan needs the native wl_display/wl_surface pointers.
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = [
    "client",
    "staging",
    "unstable",
] }
wayland-backend = { version = "0.3.15", features = ["client_system"] }
smithay-client-toolkit = { version = "0.21.1", features = ["calloop", "xkbcommon"] }
ash = "0.38"
xkbcommon = "0.9"
zeroize = "1.8"

# CLI, automation, and shared utility tooling
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
rustc-hash = "2"
walkdir = "2"
tempfile = "3"
toml_edit = "0.22"
cc = "1"
pkg-config = "0.3"


[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

# Accelerate proc-macro expansion and code generation in dev builds
[profile.dev.package]
syn = { opt-level = 3 }
quote = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
serde_derive = { opt-level = 3 }
thiserror-impl = { opt-level = 3 }
zbus_macros = { opt-level = 3 }
serde_json = { opt-level = 3 }
resvg = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
usvg = { opt-level = 3 }
image = { opt-level = 3 }
aegis-design = { codegen-units = 1 }
aegis-logging = { codegen-units = 1 }

# Keep the compositor responsive without applying full release optimization to
# workspace crates on every edit. Dependencies change less often, so their
# one-time optimization cost is amortized by Cargo's build cache.
[profile.dev.package."*"]
opt-level = 2

# Dedicated profiling & benchmark profile: avoids ThinLTO compile delays
# while maintaining near-release runtime speed with full debug symbols.
[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16

# Release builds favor a smaller binary: thin LTO plus a single codegen unit
# deduplicates generics across crate boundaries, and the symbol table is
# stripped. Panic messages still carry file:line, but stripped binaries
# resolve no function names in backtraces — keep that in mind when debugging
# production crashes.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"

# Practical exceptions for GUI / UI and complex protocol models
too_many_arguments = "allow"
enum_variant_names = "allow"
large_enum_variant = "allow"

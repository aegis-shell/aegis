[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.74"
repository = "."

[workspace.dependencies]
# flux (rendering engine) + lens (immediate-mode UI engine) Rust bindings.
# flux-rs wraps libflux; lens-rs wraps liblens (the successor to the old
# flux-ui). Each C library lives as a sibling under ../optics and is built
# with meson; point FLUX_BUILD_DIR / LENS_BUILD_DIR at their build trees.
flux = { path = "../optics/flux-rs/crates/flux" }
flux-sys = { path = "../optics/flux-rs/crates/flux-sys" }
lens = { path = "../optics/lens-rs/crates/lens" }
lens-sys = { path = "../optics/lens-rs/crates/lens-sys" }

# Observability: the facade in every crate, the impl only in the binary.
# Long-term this seam is also how the AI-adaptation phase subscribes to
# compositor events.
log = "0.4"
env_logger = "0.11"

# Typed errors without handwritten Display/From impls.
thiserror = "1"

# Launcher (ass-apps): XDG base-directory resolution and .desktop / index.theme
# INI parsing. Kept off every other crate.
dirs = "5"
rust-ini = "0.20"

# Internal crates.
ass-core = { path = "crates/ass-core" }
ass-protocols = { path = "crates/ass-protocols" }
ass-server = { path = "crates/ass-server" }
ass-backend = { path = "crates/ass-backend" }
ass-render = { path = "crates/ass-render" }
ass-shell = { path = "crates/ass-shell" }
ass-wallpaper = { path = "crates/ass-wallpaper" }
# Launcher: XDG application discovery + detached launch. See ADR-0022.
ass-apps = { path = "crates/ass-apps" }
ass-launch = { path = "crates/ass-launch" }

# Image decode for the wallpaper crate. default-features off so the
# avif decoder (which needs dav1d on the host) does not gate the build;
# the enabled set covers every still and animated format the wallpaper
# advertises.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tiff",
    "tga",
    "qoi",
    "pnm",
    "rayon",
] }

[profile.dev]
opt-level = 0

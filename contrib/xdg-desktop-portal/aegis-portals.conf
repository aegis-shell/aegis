[preferred]
# Aegis is the full-stack default backend (ADR-0086). GTK remains the
# safety net for interfaces Aegis does not implement (Access, Print,
# Location, Background, …): the frontend only asks Aegis for the interfaces
# advertised in aegis.portal and falls to GTK for the rest.
default=aegis;gtk
org.freedesktop.impl.portal.Settings=aegis;gtk
org.freedesktop.impl.portal.Screenshot=aegis;gtk
org.freedesktop.impl.portal.ScreenCast=aegis
org.freedesktop.impl.portal.Inhibit=aegis;gtk
# Secret retrieval is served entirely by Aegis (at-rest vault, no frontend
# UI involved), so no fallback is needed.
org.freedesktop.impl.portal.Secret=aegis
# Lockdown is a stateless all-permissive policy query; no fallback needed.
org.freedesktop.impl.portal.Lockdown=aegis
# FileChooser runs the compositor's native file-picker chrome. GTK stays as
# fallback while the picker proves itself in production.
org.freedesktop.impl.portal.FileChooser=aegis;gtk
# Email hands the message to the session mail client via xdg-email (no UI of
# its own). GTK keeps a compose-dialog fallback.
org.freedesktop.impl.portal.Email=aegis;gtk
# AppChooser runs the compositor's native app-picker chrome. GTK stays as
# fallback while the picker proves itself in production.
org.freedesktop.impl.portal.AppChooser=aegis;gtk
# Notifications land in the compositor's own queue (toast, command panel,
# HUD); no fallback needed.
org.freedesktop.impl.portal.Notification=aegis
# Account answers only after the compositor's consent dialog; GTK keeps a
# fallback while the consent flow proves itself.
org.freedesktop.impl.portal.Account=aegis;gtk
# DynamicLauncher consents through the same dialog; non-interactive install
# tokens are always refused. GTK keeps a fallback.
org.freedesktop.impl.portal.DynamicLauncher=aegis;gtk
# Wallpaper swaps live on the compositor after a consent dialog; the reply
# is the compositor's authoritative decode receipt. GTK keeps a fallback.
org.freedesktop.impl.portal.Wallpaper=aegis;gtk
